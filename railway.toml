# Build via Dockerfile — a imagem mcr.microsoft.com/playwright/python
# ja inclui o Chromium e dependencias do Playwright.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# NOTA: o cron e o start command sao geridos na UI do Railway
# (Settings -> Cron Schedule e Custom Start Command), nao aqui.
# Producao: cron "*/15 * * * *" + "python run.py --email".
# O formato [[services]] nao e suportado pelo Railway num unico
# railway.toml — por isso foi removido (era inerte).
